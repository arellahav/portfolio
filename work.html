<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./image-slot.js"></script>
  <style>
    @font-face { font-family: 'Konstant Grotesk'; src: local('Konstant Grotesk'); }
    @font-face { font-family: 'Almoni'; src: local('Almoni DL AAA Light'), local('Almoni Light'), local('Almoni'); font-weight: 300; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #FFFBF2; color: oklch(0.15 0.005 80); }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.7; }
  </style>
</helmet>

<header style="position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #FFFBF2; border-bottom: 1px solid oklch(0.15 0.005 80 / 0.15); display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 24px 44px; box-sizing: border-box;">
  <a href="index.html#top" style="font-family: 'Konstant Grotesk', 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.06em;">AREL LAHAV</a>
  <nav style="display: flex; gap: 28px; font-size: 15px; font-weight: 500; font-family: 'Konstant Grotesk', 'Space Grotesk', sans-serif;">
    <a href="index.html#top" style="opacity: 0.5;">Home</a>
    <a href="work.html" style="opacity: 1; font-weight: 700;">Work</a>
    <a href="index.html#about" style="opacity: 0.5;">About</a>
  </nav>
</header>

<section style="display: grid; grid-template-columns: minmax(0, 0.7fr) minmax(0, 2.4fr) minmax(0, 0.7fr); position: relative; margin-top: 71px; min-height: calc(100vh - 71px);">
  <!-- COL 1 -->
  <div style="padding: 40px 44px; box-sizing: border-box; border-right: 1px solid oklch(0.15 0.005 80 / 0.15); min-width: 0;"></div>

  <!-- COL 2 -->
  <div style="padding: 40px 0; box-sizing: border-box; border-right: 1px solid oklch(0.15 0.005 80 / 0.15); min-width: 0;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 0 56px 40px;">
      <h1 style="font-family: 'Konstant Grotesk', 'Space Grotesk', sans-serif; font-size: clamp(40px, 5vw, 64px); font-weight: 600; margin: 0; letter-spacing: -0.01em;">My Work.</h1>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-top: 12px;">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
          <button onClick="{{ f.select }}" style="background: none; border: none; padding: 0; cursor: pointer; font-family: 'Konstant Grotesk', 'Space Grotesk', sans-serif; font-size: 15px; color: {{ f.color }}; font-weight: {{ f.weight }};">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px 32px; padding: 0 56px;">
      <sc-for list="{{ visibleProjects }}" as="p" hint-placeholder-count="6">
        <a href="{{ p.href }}" style="display: block;">
          <div style="width: 100%; aspect-ratio: 4/3; overflow: hidden; margin-bottom: 12px; position: relative;">
            <image-slot id="{{ p.slotOverrideId }}" shape="rect" placeholder="{{ p.name }} shot" src="{{ p.imgSrc }}"></image-slot>
            <sc-if value="{{ p.videoSrc }}" hint-placeholder-val="{{ false }}">
              <video ref="{{ p.videoRef }}" src="{{ p.videoSrc }}" muted="" loop="" playsinline="" preload="auto" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: {{ p.videoDisplay }};"></video>
            </sc-if>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-family: 'Konstant Grotesk', 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600;">{{ p.name }} <span style="font-weight: 400; color: oklch(0.15 0.005 80 / 0.55);">{{ p.category }}</span></span>

          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- COL 3 -->
  <div style="padding: 40px 44px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; min-width: 0;">
    <div style="margin-top: auto; position: sticky; bottom: 24px; z-index: 3; text-align: right;">
      <a href="mailto:arellahav@gmail.com" style="font-size: 15px; font-weight: 600; font-family: 'Konstant Grotesk', 'Space Grotesk', sans-serif;">arellahav@gmail.com</a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeFilter: 'All', videoOk: {} };
  _projectsRaw() {
    return [
      { name: 'LOCUS', category: 'UI/UX & Complex Systems', year: '26', slotId: 'p-locus', href: './project-locus.html', tags: ['UI/UX'], imgSrc: '' },
      { name: 'wearher', category: 'UX/UI', year: '26', slotId: 'p-wearher', href: './project-wearher.html', tags: ['UI/UX'], imgSrc: './assets/wearher-main.png', noVideo: true },
      { name: 'AURA', category: 'UX/UI · Vibe Code', year: '26', slotId: 'p-aura', href: './project-aura.html', tags: ['UI/UX'], imgSrc: '' },
      { name: 'rosh', category: 'Brand Identity', year: '25', slotId: 'p-rosh', href: './project-rosh.html', tags: ['Branding'], imgSrc: './assets/rosh-03.png', noVideo: true },
      { name: 'My Brilliant Friend', category: 'Motion Design · Book Opening', year: '26', slotId: 'p-mbf', href: './project-my-brilliant-friend.html', tags: ['Motion', 'Illustration'], imgSrc: '' },
      { name: 'We Didn\u2019t Know', category: 'Motion · Kinetic Typography', year: '26', slotId: 'p-wdk', href: './project-we-didnt-know.html', tags: ['Motion'], imgSrc: '' },
      { name: 'Choosing Angles', category: '2D Animation & Character Design', year: '26', slotId: 'p-angles', href: './project-choosing-angles.html', tags: ['Motion', 'Illustration'], imgSrc: '' },
    ];
  }
  _setFilter(name) {
    this.setState({ activeFilter: name });
  }
  _attachVideo(el, slotId) {
    if (!el) return;
    el.muted = true;
    el.defaultMuted = true;
    el.volume = 0;
    el.addEventListener('loadeddata', () => { el.muted = true; this.setState((s) => ({ videoOk: { ...s.videoOk, [slotId]: true } })); });
    el.addEventListener('error', () => this.setState((s) => ({ videoOk: { ...s.videoOk, [slotId]: false } })));
    el.addEventListener('volumechange', () => { if (!el.muted) el.muted = true; });
    if (!this._observer) {
      this._observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) entry.target.play().catch(() => {});
          else entry.target.pause();
        });
      }, { threshold: 0.25 });
    }
    this._observer.observe(el);
  }
  renderVals() {
    const all = this._projectsRaw();
    const categories = ['All', 'UI/UX', 'Branding', 'Motion', 'Illustration'];
    const active = this.state.activeFilter;
    const visibleProjects = (active === 'All' ? all : all.filter((p) => p.tags.includes(active))).map((p) => ({
      ...p,
      videoSrc: p.noVideo ? '' : './videos/' + p.slotId + '.mp4',
      slotOverrideId: p.slotId === 'p-rosh' ? 'p-rosh' : p.slotId + '-work',
      videoDisplay: this.state.videoOk[p.slotId] ? 'block' : 'none',
      videoRef: (el) => this._attachVideo(el, p.slotId),
    }));
    const filters = categories.map((c) => ({
      label: c,
      select: () => this._setFilter(c),
      weight: active === c ? 700 : 400,
      color: active === c ? 'oklch(0.15 0.005 80)' : 'oklch(0.15 0.005 80 / 0.5)',
    }));
    return { filters, visibleProjects };
  }
}
</script>
</body>
</html>
